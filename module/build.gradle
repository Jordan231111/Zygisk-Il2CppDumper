import com.android.build.api.artifact.SingleArtifact
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'com.android.library'
}
apply from: rootProject.file('module.gradle')

def targetPackage = providers.gradleProperty('targetPackage').orElse('com.game.packagename').get()
if (!(targetPackage ==~ /[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+/)) {
    throw new GradleException('targetPackage must be an Android package name')
}

android {
    namespace = 'zygisk.il2cppdumper'
    enableKotlin = false
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    ndkVersion = providers.gradleProperty('ndkVersion').orElse('30.0.16248370').get()
    defaultConfig {
        minSdk = 23
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                        "-DMODULE_NAME=${moduleLibraryName}",
                        "-DGAME_PACKAGE_NAME=${targetPackage}"
            }
        }
        ndk {
            abiFilters.addAll(['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'])
        }
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = providers.gradleProperty('cmakeVersion').orElse('4.4.3').get()
        }
    }
    buildFeatures {
        buildConfig = false
    }
}

// The AAR is a public AGP artifact. Do not depend on AGP's internal build paths.
androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.name.capitalize()
        def aar = variant.artifacts.get(SingleArtifact.AAR.INSTANCE)
        def stage = rootProject.layout.buildDirectory.dir("magisk/${variant.name}")
        def prepare = tasks.register("prepareMagiskFiles${suffix}", Sync) {
            dependsOn(aar)
            into(stage)
            from(rootProject.file('template/magisk_module')) {
                exclude 'module.prop'
            }
            from(rootProject.file('template/magisk_module/module.prop')) {
                expand(id: magiskModuleId, name: moduleName, version: moduleVersion,
                        versionCode: moduleVersionCode, author: moduleAuthor,
                        description: "${moduleDescription} Default target: ${targetPackage}.")
                filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
            }
            from(aar.map { zipTree(it) }) {
                include "jni/*/lib${moduleLibraryName}.so"
                eachFile { entry ->
                    entry.relativePath = new RelativePath(true, 'zygisk', "${entry.relativePath.segments[1]}.so")
                }
                includeEmptyDirs = false
            }
        }
        def archive = tasks.register("zip${suffix}", Zip) {
            dependsOn(prepare)
            from(stage)
            archiveFileName = "${magiskModuleId.replace('_', '-')}-${moduleVersion}-${variant.name}.zip"
            destinationDirectory = rootProject.layout.projectDirectory.dir('out')
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        if (variant.name == 'release') {
            def installable = tasks.register('copyInstallableZip', Copy) {
                from(archive.flatMap { it.archiveFile })
                into(rootProject.layout.projectDirectory.dir('out'))
                rename { 'zygisk.zip' }
            }
            archive.configure { finalizedBy(installable) }
        }
        tasks.matching { it.name == "assemble${suffix}" }.configureEach {
            finalizedBy(archive)
        }
    }
}
