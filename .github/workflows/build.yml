name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_name:
        description: Default target package (targets.txt can override it after installation)
        required: true
        type: string
      full_validation:
        description: Run maintainer tests, Debug/lint and emulator checks (slower)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  host-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.full_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_format.py
      - run: cmake -S . -B build/host -G Ninja -DDUMPER_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host && ctest --test-dir build/host --output-on-failure --output-junit results.xml
      - name: Exercise 32-bit pointer and file-offset handling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-multilib
          cmake -S . -B build/host32 -G Ninja -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Debug -DDUMPER_SANITIZERS=ON
          cmake --build build/host32
          ctest --test-dir build/host32 --output-on-failure --output-junit results.xml
          build/host32/core_tests --require-high-address
  android:
    needs: host-tests
    # Package-only builds deliberately skip host tests; failed validation still blocks publishing.
    if: ${{ !cancelled() && (needs.host-tests.result == 'success' || needs.host-tests.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_PACKAGE: ${{ inputs.package_name || 'com.game.packagename' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap pinned Android command-line tools
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          # Hosted images can predefine the legacy variable; keep one SDK path.
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          export ANDROID_HOME="$sdk"
          printf 'y\n%.0s' {1..100} | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android build dependencies
        run: |
          android update
          for package in platforms/android-37.0 build-tools/37.0.0 ndk/30.0.16248370; do
            android sdk install "$package"
          done
      - name: Build Release module
        if: github.event_name == 'workflow_dispatch' && !inputs.full_validation
        run: ./gradlew ":module:assembleRelease" "-PtargetPackage=$TARGET_PACKAGE" --warning-mode=fail --console=plain
      - name: Build Debug, Release and Android lint
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: ./gradlew ":module:assembleDebug" ":module:assembleRelease" ":module:lint" "-PtargetPackage=$TARGET_PACKAGE" --warning-mode=fail --console=plain
      - name: Verify installable module
        run: python scripts/verify_module.py out/zygisk.zip --readelf "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Verify Debug module
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: python scripts/verify_module.py out/*-debug.zip --readelf "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Build synthetic Android runtime tests
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/30.0.16248370/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/android
      - name: Native static analysis
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: |
          "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-tidy"             -p build/android module/src/main/cpp/core/*.cpp             --checks='-*,clang-analyzer-*,bugprone-use-after-move,bugprone-sizeof-expression'             --warnings-as-errors='*' --quiet
      - name: Start Android 17 x86_64 emulator
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: |
          android sdk install platform-tools
          android sdk install emulator
          android sdk install 'system-images/android-37.0/google_apis/x86_64'
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd -n il2cpp-ci -k 'system-images;android-37.0;google_apis;x86_64' --device pixel_5
          "$ANDROID_HOME/emulator/emulator" -avd il2cpp-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -port 5554 > build/emulator.log 2>&1 &
          python scripts/wait_device.py --serial emulator-5554
      - name: Exercise native runtime and failure paths
        if: github.event_name != 'workflow_dispatch' || inputs.full_validation
        run: python scripts/test_device.py --serial emulator-5554 --build-dir build/android
      - name: Upload directly installable Magisk module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/zygisk.zip
          archive: false
          if-no-files-found: error
      - name: Stop emulator
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.full_validation)
        run: adb -s emulator-5554 emu kill || true
